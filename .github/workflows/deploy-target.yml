# One deploy to one Linode host, called by deploy.yml for dev and staging.
#
# Host layout (prepared once by hand, see README "Deploy"):
#   <path>/api        Laravel app; <path>/api/.env and storage/ live only on
#                     the host and are never overwritten
#   <path>/web        the built web app (static files served by the web server)
# The host has PHP 8.3 with pdo_pgsql, pcntl and posix, Composer, and its .env points the
# runtime connection at role `app`, DB_OWNER_* at `app_owner` (ADR 002) and
# DB_PLATFORM_* at `app_platform` (ADR 013).
name: Deploy target

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name (dev or staging)
        required: true
        type: string
      ref:
        description: Commit to deploy (the one CI tested)
        required: true
        type: string
      api-url:
        description: Public API base URL baked into the web build
        required: true
        type: string
    # Not host, user or path: a workflow_call secret with one of those names
    # replaced HOST, USER or PATH in the job (PATH became the deploy path, so
    # npm found no sh).
    secrets:
      deploy-host:
        required: true
      deploy-user:
        required: true
      ssh-key:
        required: true
      known-hosts:
        required: true
      deploy-path:
        required: true
      # NFR-10: optional; source maps are uploaded to Sentry only when set.
      sentry-auth-token:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # NFR-10: the release is the commit; Sentry is on only when the
      # environment's SENTRY_WEB_DSN variable is set. Hidden source maps are
      # built only when a Sentry token is set, uploaded, then deleted, so
      # they are never served.
      - name: Build web
        env:
          VITE_APP_NAME: ${{ vars.APP_NAME || 'App' }}
          VITE_API_URL: ${{ inputs.api-url }}
          VITE_SENTRY_DSN: ${{ vars.SENTRY_WEB_DSN }}
          VITE_SENTRY_RELEASE: ${{ inputs.ref }}
          VITE_SENTRY_ENVIRONMENT: ${{ inputs.environment }}
          VITE_SOURCEMAP: ${{ secrets.sentry-auth-token != '' && 'hidden' || '' }}
        run: npm run build -w web

      - name: Upload web source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.sentry-auth-token }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://sentry.io/' }}
          RELEASE: ${{ inputs.ref }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "No Sentry token: source maps not uploaded."
            exit 0
          fi
          npx sentry-cli sourcemaps inject web/dist
          npx sentry-cli sourcemaps upload --release "$RELEASE" web/dist
          find web/dist -name '*.map' -delete

      # NFR-10: the API reports the same release (config/sentry.php reads api/REVISION).
      - name: Record the release
        env:
          RELEASE: ${{ inputs.ref }}
        run: printf '%s\n' "$RELEASE" > api/REVISION

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ssh-key }}
          KNOWN_HOSTS: ${{ secrets.known-hosts }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # From here until `artisan up` at the very end, the API answers 503
      # (maintenance), so a deploy that stops halfway (failed preflight or
      # migration) never serves new code against an old schema. The
      # maintenance flag lives in storage/, which the rsync never touches.
      # A first deploy has no artisan or vendor/ yet: nothing to take down.
      # If the previous release cannot boot at all, `down` fails: the deploy
      # warns and continues, since that release is not serving anyway.
      - name: Put the API in maintenance mode
        env:
          HOST: ${{ secrets.deploy-host }}
          DEPLOY_USER: ${{ secrets.deploy-user }}
          DEPLOY_PATH: ${{ secrets.deploy-path }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") bash -se" <<'REMOTE'
          set -uo pipefail
          cd "$DEPLOY_PATH/api" 2>/dev/null || { echo "First deploy: no API yet."; exit 0; }
          # storage/ is never rsynced, so its skeleton exists only if a deploy made it.
          mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          if [ -f artisan ] && [ -f vendor/autoload.php ]; then
            php artisan down --retry=60 || echo "::warning::php artisan down failed; the previous release could not boot."
          else
            echo "First deploy: no API yet."
          fi
          REMOTE

      # The host's .env, storage/, vendor/ and cached bootstrap files are
      # excluded, so --delete never touches them.
      - name: Rsync build to host
        env:
          HOST: ${{ secrets.deploy-host }}
          DEPLOY_USER: ${{ secrets.deploy-user }}
          DEPLOY_PATH: ${{ secrets.deploy-path }}
        run: |
          ssh_cmd="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          rsync -az --delete -e "$ssh_cmd" \
            --exclude '.env' \
            --exclude 'vendor/' \
            --exclude 'storage/' \
            --exclude 'bootstrap/cache/*.php' \
            --exclude 'tests/' \
            --exclude 'node_modules/' \
            api/ "$DEPLOY_USER@$HOST:$DEPLOY_PATH/api/"
          rsync -az --delete -e "$ssh_cmd" \
            web/dist/ "$DEPLOY_USER@$HOST:$DEPLOY_PATH/web/"

      # The previous release's cached config is deleted first, so nothing
      # boots with it. app:preflight gates the migration. Migrations run as
      # the schema owner (pgsql_owner); the app keeps
      # running as the RLS-bound role. permissions:sync upserts the
      # permission catalogue (RBAC-01); currencies:sync upserts the ISO 4217
      # catalogue from ICU (CUR-01); country-packs:publish loads the KE and
      # CD pack files as new versions when they changed (CP-01, CP-03);
      # country-packs:holidays replaces each country's public holidays from
      # its holidays.json, so re-running it is safe (CP-01, WF-09, APR-05).
      # horizon:terminate stops this host's Horizon master gracefully (its
      # process manager starts it again on the new code); queue:restart
      # also tells any other worker sharing the Redis cache to restart.
      # A separate queue host must run horizon:terminate itself after it
      # receives the release (README "Queue workers").
      # Any failure stops here with the API still in maintenance. See
      # README "If a deploy stops".
      - name: Install, migrate, restart workers and go live
        env:
          HOST: ${{ secrets.deploy-host }}
          DEPLOY_USER: ${{ secrets.deploy-user }}
          DEPLOY_PATH: ${{ secrets.deploy-path }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$HOST" \
            "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH/api"
          # Drop the previous release's cached config and routes before
          # anything boots the new code (composer runs package:discover).
          rm -f bootstrap/cache/config.php bootstrap/cache/routes-*.php
          # NFR-01: storage/ is excluded from the rsync, so a first deploy has
          # none: Laravel needs this skeleton (maintenance flag, compiled mail
          # views, logs). Found by the deploy rehearsal (2026-10-22).
          mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
          php artisan config:clear
          # NFR-06: stop before migrating when the host is not ready (drivers,
          # APP_KEY, APP_DEBUG, database roles). Prints every check.
          php artisan app:preflight
          # Phase 8 review L9: the owner connection gives up on a lock after
          # DB_OWNER_LOCK_TIMEOUT (5s); a migration that timed out is tried
          # again (3 attempts, 15 s apart). Any other failure stops here.
          bash database/scripts/migrate-with-retry.sh
          php artisan permissions:sync
          php artisan currencies:sync
          php artisan country-packs:publish KE
          php artisan country-packs:publish CD
          php artisan country-packs:holidays KE
          php artisan country-packs:holidays CD
          php artisan uoms:seed-defaults
          php artisan payment-methods:seed-defaults
          # SUB-02, SUB-07: modules installed since a tenant subscribed are switched on when its plan covers them.
          php artisan billing:sync-modules
          # SUB-02, ADR 016: once per environment, trial subscriptions for
          # tenants created before billing (idempotent). The marker lives in
          # storage/, which deploys never touch. A failure (for example no
          # operator tenant yet, `platform:operator`) is reported and tried
          # again on the next deploy; it never keeps the API down.
          if [ ! -f storage/app/deploy/billing-backfill.done ]; then
            if php artisan billing:backfill-subscriptions; then
              mkdir -p storage/app/deploy && date -u +%FT%TZ > storage/app/deploy/billing-backfill.done
            else
              echo "::warning::billing:backfill-subscriptions failed; it runs again on the next deploy (docs/deploy-linode.md)."
            fi
          fi
          php artisan config:cache
          php artisan route:cache
          php artisan horizon:terminate
          php artisan queue:restart
          # Only once every step above succeeded.
          php artisan up
          # NFR-01: the readiness checks (database, Redis, queue, storage) from
          # the host itself; also writes the status snapshot. Reported, not fatal:
          # the release is already live.
          php artisan health:status || echo "::warning::The readiness checks failed after the deploy; see php artisan health:status on the host."
          REMOTE

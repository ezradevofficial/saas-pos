# Deploy to the dev and then the staging Linode.
#
# Owner decision (2026-10-28): dev and staging deploy straight away on every
# push to main, while CI runs alongside, so staging is up to date in minutes
# instead of after the full suite. If CI then fails for the commit that is
# live, the last commit CI passed is deployed again (rollback). A newer push
# makes the rollback moot: it deploys itself and gets its own CI run.
# Migrations are not reversed by a rollback; they are additive by rule, so
# the older code runs on the newer schema. Production, when it exists, keeps
# the full CI gate. Each environment deploys only when its credentials are
# set as repository secrets (see README, "Deploy"); until then its job is
# skipped and the run still succeeds (ADR 001).
name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Deploys run one after the other, never cancelled halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # A push or a manual run deploys its own commit. A failed CI run deploys the
  # last green commit, but only while the failed commit is still main's head.
  gate:
    name: Choose the commit and check deploy credentials
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'failure'
        && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    outputs:
      dev: ${{ steps.check.outputs.dev }}
      staging: ${{ steps.check.outputs.staging }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Commit to deploy
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FAILED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$head" != "$FAILED" ]; then
            echo "::notice title=No rollback::CI failed for ${FAILED:0:8}, but main has moved on to ${head:0:8}, which deploys itself."
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          green="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
          if [ -z "$green" ]; then
            echo "::warning title=No rollback::CI failed for ${FAILED:0:8} and no green commit was found to roll back to."
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning title=Rollback::CI failed for ${FAILED:0:8}; deploying the last green commit ${green:0:8}."
          echo "sha=$green" >> "$GITHUB_OUTPUT"

      - name: Check which environments have credentials
        id: check
        env:
          SHA: ${{ steps.sha.outputs.sha }}
          DEV_HOST: ${{ secrets.DEV_LINODE_HOST }}
          DEV_USER: ${{ secrets.DEV_LINODE_USER }}
          DEV_KEY: ${{ secrets.DEV_LINODE_SSH_KEY }}
          DEV_KNOWN_HOSTS: ${{ secrets.DEV_LINODE_KNOWN_HOSTS }}
          DEV_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          DEV_API_URL: ${{ vars.DEV_API_URL }}
          STAGING_HOST: ${{ secrets.STAGING_LINODE_HOST }}
          STAGING_USER: ${{ secrets.STAGING_LINODE_USER }}
          STAGING_KEY: ${{ secrets.STAGING_LINODE_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_LINODE_KNOWN_HOSTS }}
          STAGING_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          for env in DEV STAGING; do
            missing=""
            for name in HOST USER KEY KNOWN_HOSTS PATH API_URL; do
              var="${env}_${name}"
              [ -n "${!var}" ] || missing="$missing $var"
            done
            flag="$(echo "$env" | tr '[:upper:]' '[:lower:]')"
            if [ -n "$SHA" ] && [ -z "$missing" ]; then
              echo "$flag=true" >> "$GITHUB_OUTPUT"
            else
              echo "$flag=false" >> "$GITHUB_OUTPUT"
              [ -z "$missing" ] || echo "::notice title=Deploy to $flag skipped::Missing:$missing (see README, Deploy)"
            fi
          done

  dev:
    name: Deploy to dev
    needs: gate
    if: needs.gate.outputs.dev == 'true'
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment: dev
      ref: ${{ needs.gate.outputs.sha }}
      api-url: ${{ vars.DEV_API_URL }}
    secrets:
      deploy-host: ${{ secrets.DEV_LINODE_HOST }}
      deploy-user: ${{ secrets.DEV_LINODE_USER }}
      ssh-key: ${{ secrets.DEV_LINODE_SSH_KEY }}
      known-hosts: ${{ secrets.DEV_LINODE_KNOWN_HOSTS }}
      deploy-path: ${{ secrets.DEV_DEPLOY_PATH }}
      sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # Staging follows dev; when dev is skipped (no credentials) staging can
  # still deploy on its own.
  staging:
    name: Deploy to staging
    needs: [gate, dev]
    if: >-
      always()
      && needs.gate.outputs.staging == 'true'
      && (needs.dev.result == 'success' || needs.dev.result == 'skipped')
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment: staging
      ref: ${{ needs.gate.outputs.sha }}
      api-url: ${{ vars.STAGING_API_URL }}
    secrets:
      deploy-host: ${{ secrets.STAGING_LINODE_HOST }}
      deploy-user: ${{ secrets.STAGING_LINODE_USER }}
      ssh-key: ${{ secrets.STAGING_LINODE_SSH_KEY }}
      known-hosts: ${{ secrets.STAGING_LINODE_KNOWN_HOSTS }}
      deploy-path: ${{ secrets.STAGING_DEPLOY_PATH }}
      sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

# Lint, tests and the tenant-isolation suite on every PR and push to main
# (NFR-12, TEN-01). A PR does not merge unless every job passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job definition, several runs: the tenant-isolation suite runs on its own
  # so its result is visible separately (TEN-01), and the `slow` group (tests
  # that take minutes) beside the rest. The Feature suite excludes
  # tests/Feature/Isolation (phpunit.xml) and the slow group, so no test runs twice.
  api:
    name: api (${{ matrix.suite.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          # Unit + Feature in five shards (phpunit.xml ShardCoreA, ShardCoreB,
          # ShardModulesA, ShardModulesB, ShardModulesC) so no job nears the time limit as
          # modules are added. A new module's tests go in one of the module shards.
          - name: core a
            pint: true
            command: php artisan test --testsuite=ShardCoreA --exclude-group=slow
          - name: core b
            pint: false
            command: php artisan test --testsuite=ShardCoreB --exclude-group=slow
          - name: modules a
            pint: false
            command: php artisan test --testsuite=ShardModulesA --exclude-group=slow
          - name: modules b
            pint: false
            command: php artisan test --testsuite=ShardModulesB --exclude-group=slow
          - name: modules c
            pint: false
            command: php artisan test --testsuite=ShardModulesC --exclude-group=slow
          # TEN-01 in seven shards: every isolation test builds the full
          # two-tenant fixture, and the export, ID-probe, list and table tests
          # walk every table, route or export, so together they outgrow one
          # job's time limit. The fifth shard is every other isolation test
          # (14 in total across the five).
          - name: isolation exports
            pint: false
            command: php artisan test --testsuite=Isolation --filter='full_export|list_exports'
          - name: isolation ids
            pint: false
            command: php artisan test --testsuite=Isolation --filter='every_route_with_ids|ids_of_tenant_b_in_request_bodies'
          - name: isolation lists
            pint: false
            command: php artisan test --testsuite=Isolation --filter='list_routes_show_nothing'
          - name: isolation history
            pint: false
            command: php artisan test --testsuite=Isolation --filter='list_routes_read_only_query_parameters|every_history_type'
          - name: isolation tables
            pint: false
            command: php artisan test --testsuite=Isolation --filter='suite_runs_as|no_table_shows|every_tenant_table_is_empty'
          - name: isolation routes
            pint: false
            command: php artisan test --testsuite=Isolation --filter='every_api_route_is_authenticated|pos_insights'
          - name: isolation rest
            pint: false
            command: php artisan test --testsuite=Isolation --filter='/^(?!.*(full_export|list_exports|every_route_with_ids|ids_of_tenant_b_in_request_bodies|list_routes|every_history_type|suite_runs_as|no_table_shows|every_tenant_table_is_empty|every_api_route_is_authenticated|pos_insights)).*$/'
          # IMP-03: tests that take minutes (50,000 imported rows) run beside
          # the main job, so a PR still waits for them but not in series.
          - name: slow
            pint: false
            command: php artisan test --testsuite=Feature --group=slow
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
        with:
          # API-04: the OpenAPI check compares with HEAD~1 on pushes to main.
          fetch-depth: 2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, intl, bcmath, pcntl, posix
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # The isolation fixture touches every tenant table in one transaction, which
      # needs more lock slots than Postgres's default (64 per transaction).
      - name: Raise Postgres lock slots
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart "$(docker ps -q --filter ancestor=postgres:16)"
          until pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
          psql -h 127.0.0.1 -U postgres -tAc "SHOW max_locks_per_transaction"

      # Roles (app_owner, app, app_platform) as the postgres superuser, then the app and
      # app_test databases owned by app_owner (ADR 002).
      - name: Create roles and databases
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGSUPERUSER: postgres
          PGPASSWORD: postgres
          DATABASES: app app_test
        run: bash database/scripts/setup-local-db.sh

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Migrations run as the schema owner, never as the runtime role.
      - name: Migrate (as app_owner)
        run: composer migrate

      - name: Pint
        if: matrix.suite.pint
        run: vendor/bin/pint --test

      # API-04 (ADR 020): every public route documented in English and French,
      # the committed OpenAPI document current, and no operation or parameter
      # removed without a deprecation entry. Needs the migrated schema (Scramble
      # reads models' column types).
      - name: OpenAPI document
        if: matrix.suite.pint
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          php artisan api:docs --check
          # The base's document: the target branch for a pull request, the previous commit on a push.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          else
            BASE="HEAD~1"
          fi
          if git cat-file -e "$BASE:api/resources/openapi/v1.json" 2>/dev/null; then
            git show "$BASE:api/resources/openapi/v1.json" > "$RUNNER_TEMP/openapi-base.json"
            php artisan api:docs --against="$RUNNER_TEMP/openapi-base.json"
          else
            echo "No OpenAPI document at $BASE yet: nothing to compare."
          fi

      - name: Tests (${{ matrix.suite.name }})
        run: ${{ matrix.suite.command }}

  web:
    name: web (oxlint, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -w web

      # The manual stays complete: every route is in a topic or the exclusion list (docs/manual/route-exclusions.json).
      - name: Manual coverage
        run: npm run check:manual

      - name: Tests
        working-directory: web
        run: npx vitest run

      - name: Build
        env:
          VITE_APP_NAME: App
          VITE_API_URL: http://localhost:8008
        run: npm run build -w web

  pos:
    name: pos (jest, expo-doctor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The manual stays complete: every route is in a topic or the exclusion list (docs/manual/route-exclusions.json).
      - name: Manual coverage
        run: npm run check:manual

      - name: Tests
        working-directory: pos
        run: npx jest --ci

      # Pinned as a pos devDependency (npm run doctor).
      - name: Expo doctor
        run: npm run doctor -w pos

  tokens:
    name: tokens (build is committed, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # dist/ is committed: a token change without a rebuild fails here.
      - name: Build and check dist is up to date
        run: |
          npm run build -w @app/tokens
          git diff --exit-code packages/tokens/dist
          untracked="$(git status --porcelain --untracked-files=all packages/tokens/dist)"
          if [ -n "$untracked" ]; then
            echo "::error::packages/tokens/dist has files not committed:"
            echo "$untracked"
            exit 1
          fi

      # The manual stays complete: every route is in a topic or the exclusion list (docs/manual/route-exclusions.json).
      - name: Manual coverage
        run: npm run check:manual

      - name: Tests
        run: npm test -w @app/tokens

  i18n:
    name: i18n (missing keys, L10N-02)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Plain Node script, no dependencies to install.
      - run: npm run check:i18n
      # The check's own test (API catalogues, dotted keys).
      - run: node --test scripts/check-i18n.test.mjs
      # NFR-10: the shared scrubber (web, POS) over the fixtures the API's
      # ScrubberTest also runs; NFR-06: the security scripts' own tests.
      - run: node --test packages/scrub/test/*.test.js scripts/secret-scan.test.mjs scripts/npm-audit.test.mjs

  # ADR 025, NFR-01, NFR-07: the host provisioning, backup, restore drill and
  # watch scripts (deploy/host): bash -n, shellcheck (preinstalled on the
  # runner image) and every script in a sandboxed dry run or against stubs.
  deploy-scripts:
    name: deploy scripts (shellcheck, dry runs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --version
      - run: bash deploy/host/tests/run.sh
        env:
          REQUIRE_SHELLCHECK: '1'

  # NFR-06: dependency scanning and a committed-secret scan on every push,
  # with built-in tools only (no marketplace actions).
  composer-audit:
    name: security (composer audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      # Reads composer.lock against the advisory database; fails on any advisory.
      - run: composer audit --locked --no-interaction

  npm-audit:
    name: security (npm audit)
    runs-on: ubuntu-24.04
    # Two audit attempts, each of which may wait out a registry timeout.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # npm audit --omit=dev at high and above, minus reviewed, dated
      # exceptions (scripts/npm-audit-allowlist.json). Reads package-lock.json.
      - run: node scripts/npm-audit.mjs

  secret-scan:
    name: security (secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # Every tracked file against committed-secret patterns; reviewed
      # fixtures in scripts/secret-scan-allowlist.json.
      - run: node scripts/secret-scan.mjs

# Local PostgreSQL and Redis. The API itself runs on the host on port 8008
# (php artisan serve --port=8008); the web app on 3008.
#
# The container's superuser is `postgres`, never `app`: the runtime role
# must not be a superuser or row-level security is bypassed (ADR 002).
# After `docker compose up -d`, create the roles and databases with
#   PGSUPERUSER=postgres PGPASSWORD=postgres bash api/database/scripts/setup-local-db.sh
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:

<!-- @dsCard group="Forms" height=200 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TextField preview</title>
<style>
  body { margin: 0; padding: 20px; background: var(--surface-100); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .muted { color: var(--ink-muted); font-size: 12px; line-height: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var B = window.DS, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
h('div',{className:'grid2'},
  h(B.TextField,{label:'Supplier name',placeholder:'e.g. Bidco Africa',required:true}),
  h(B.TextField,{label:'Unit price',prefix:'USD',defaultValue:'12.50',help:'Before VAT'}),
  h(B.TextField,{label:'KRA PIN',defaultValue:'A00123',error:'A KRA PIN has 11 characters, like A012345678Z.'}),
  h(B.TextField,{label:'Exchange rate',prefix:'CDF',defaultValue:'2,850',disabled:true,help:'Set by the finance team'}))
  ));
</script>
</body>
</html>

<!doctype html>
<html>
<head><meta charset="utf-8"><title>Alert preview</title>
<style>
  body { margin: 0; padding: 20px; background: var(--surface-100); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .muted { color: var(--ink-muted); font-size: 12px; line-height: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var B = window.DS, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
h('div',{className:'stack'},
  h(B.Alert,{tone:'warning',title:'You are 2 devices over your plan',action:h(B.Button,{size:'md'},'Upgrade')},'Adding devices will be paused in 5 days. Sales are not affected.'),
  h(B.Alert,{tone:'danger',title:'Payment not confirmed'},'Ask the customer to check their M-Pesa messages, or try again.'),
  h(B.Alert,{tone:'success'},'Purchase order PO-NBO-2026-00412 approved and sent to the supplier.'))
  ));
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone POS offline</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/platform/tokens.css">
<link rel="stylesheet" href="ds/platform/components/bundle.css">
<script src="ds/platform/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:var(--primary)}a:hover{color:var(--primary-hover)}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); font-size: 16px; line-height: 24px;">
  <header style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 16px 16px 12px; background: var(--surface-200); border-bottom: 1px solid var(--border);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div style="font-weight: 600; font-size: 18px; line-height: 24px;">Duka la Mama Njeri</div>
        <div style="font-size: 12px; line-height: 16px; color: var(--ink-muted);">Kawangware · Phone till</div>
      </div>
      <button type="button" aria-label="Menu" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-200); color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
    </div>
    <x-import component-from-global-scope="DS.SyncStatus" state="offline" pending="{{7}}"></x-import>
  </header>

  <div style="flex: none; padding: 12px 16px 0;">
    <div style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-200);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" style="color: var(--ink-muted);"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="phone-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Search products</label>
      <input id="phone-search" placeholder="Search or scan" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink); font: 400 16px/24px var(--font-sans);">
      <button type="button" aria-label="Scan barcode with camera" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: var(--primary-tint); color: var(--primary); cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"></path></svg>
      </button>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow: auto; padding: 12px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start;">
    <sc-for list="{{products}}" as="p" hint-placeholder-count="8">
      <x-import component-from-global-scope="DS.PosTile" name="{{p.name}}" price="{{p.price}}" currency="KES" stock="{{p.stock}}"></x-import>
    </sc-for>
  </div>

  <div style="flex: none; padding: 16px; background: var(--surface-200); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <div style="font-weight: 600;">5 items</div>
        <div style="font-size: 12px; line-height: 16px; color: var(--ink-muted);">Tap to see the sale</div>
      </div>
      <x-import component-from-global-scope="DS.Money" amount="{{735}}" currency="KES" size="lg"></x-import>
    </div>
    <x-import component-from-global-scope="DS.Button" variant="pay" size="lg" block="{{true}}">Charge KES 735.00</x-import>
    <div style="font-size: 12px; line-height: 16px; color: var(--ink-muted); text-align: center;">Offline: cash and M-Pesa till payments are recorded and sent to KRA eTIMS when you reconnect.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","executive","warm"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      theme: this.props.theme ?? 'light',
      products: [
        { name: 'Unga wa ngano 2kg', price: 210, stock: 14 },
        { name: 'Royco cubes (12)', price: 60, stock: 30 },
        { name: 'Blue Band 250g', price: 145, stock: 2 },
        { name: 'Eggs (tray of 30)', price: 480, stock: 6 },
        { name: 'Ketepa Tea 100g', price: 95, stock: 22 },
        { name: 'Omo 500g', price: 165, stock: 0 },
        { name: 'Safaricom airtime 100', price: 100, stock: 50 },
        { name: 'Tomatoes (per kg)', price: 120, stock: 9 }
      ]
    };
  }
}
</script>
</body>
</html>
